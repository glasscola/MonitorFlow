name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.402'
      - name: Restore application
        run: dotnet restore MonitorFlow/MonitorFlow.csproj
      - name: Build application
        run: dotnet build MonitorFlow/MonitorFlow.csproj -c Release --no-restore
      - name: Run geometry tests
        run: dotnet run --project MonitorFlow.Tests/MonitorFlow.Tests.csproj -c Release
