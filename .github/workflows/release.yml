name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.402'
      - name: Run geometry tests
        run: dotnet run --project MonitorFlow.Tests/MonitorFlow.Tests.csproj -c Release
      - name: Build self-contained executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          dotnet restore MonitorFlow/MonitorFlow.csproj -r win-x64 -p:SelfContained=true --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet publish MonitorFlow/MonitorFlow.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Version=$version -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o artifacts/portable
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Package documentation and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'docs/MonitorFlow-Manual-KO.pdf' -Destination 'artifacts/portable/MonitorFlow-Manual-KO.pdf'
          Copy-Item -LiteralPath 'docs/사용안내.md' -Destination 'artifacts/portable/사용안내.md'
          Copy-Item -LiteralPath 'artifacts/portable/MonitorFlow.exe' -Destination 'artifacts/MonitorFlow.exe'
          Copy-Item -LiteralPath 'artifacts/portable/MonitorFlow-Manual-KO.pdf' -Destination 'artifacts/MonitorFlow-Manual-KO.pdf'
          Compress-Archive -Path 'artifacts/portable/*' -DestinationPath 'artifacts/MonitorFlow-win-x64.zip'
          $lines = Get-ChildItem -LiteralPath 'artifacts' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath 'artifacts/SHA256SUMS.txt' -Encoding utf8
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: MonitorFlow ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/MonitorFlow.exe
            artifacts/MonitorFlow-Manual-KO.pdf
            artifacts/MonitorFlow-win-x64.zip
            artifacts/SHA256SUMS.txt
